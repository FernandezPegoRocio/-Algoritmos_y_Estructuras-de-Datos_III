openapi: "3.0.0"

info:
  title: "People API"
  description: "An API about people"
  version: "1.0.0"

servers:
  - url: "/api"

paths:
  /people:
    get:
      operationId: "people.read_all"
      tags:
        - "People"
      summary: "Read the list of people"
      responses:
        "200":
          description: "Successfully read people list"
    post:
      operationId: "people.create"
      tags:
        - "People"
      summary: "Create a person"
      requestBody:
        description: "Person to create"
        required: True
        content:
          application/json:
            schema:
              x-body-name: "body"
              type: "object"
              properties:
                fname:
                  type: "string"
                lname:
                  type: "string"
      responses:
        "201":
          description: "Successfully created person"
        "406":
          description: "Person already exists"

  /people/{lname}:
    get:
      operationId: "people.read_one"
      tags:
        - "People"
      summary: "Read one person"
      parameters:
        - name: lname
          in: path
          required: True
          schema:
            type: "string"
      responses:
        "200":
          description: "Successfully read person"
        "404":
          description: "Person not found"
    put:
      operationId: "people.update"
      tags:
        - "People"
      summary: "Update a person"
      parameters:
        - name: lname
          in: path
          required: True
          schema:
            type: "string"
      requestBody:
        description: "Person to update"
        required: True
        content:
          application/json:
            schema:
              x-body-name: "body"
              type: "object"
              properties:
                fname:
                  type: "string"
                lname:
                  type: "string"
      responses:
        "200":
          description: "Successfully updated person"
        "404":
          description: "Person not found"
    delete:
      operationId: "people.delete"
      tags:
        - "People"
      summary: "Delete a person"
      parameters:
        - name: lname
          in: path
          required: True
          schema:
            type: "string"
      responses:
        "200":
          description: "Successfully deleted person"
        "404":
          description: "Person not found"
